<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 O Preço da Desconfiança</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .price {
            text-align: center;
            font-size: 32px;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover {
            opacity: 0.9;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .loading { background: #d1ecf1; color: #0c5460; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 O Preço da Desconfiança</h1>
        <p style="text-align: center; color: #666; margin-bottom: 10px;">Audiolivro + Livro Completo</p>
        <div class="price">R$ 14,90</div>

        <form id="form" onsubmit="gerarPix(event)">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required minlength="3">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>

            <button type="submit" class="btn" id="btn">💳 Gerar Pix Agora</button>
        </form>

        <div id="status"></div>

        <p style="text-align: center; margin-top: 20px; color: #888; font-size: 14px;">
            🔒 Pagamento 100% seguro via Asaas
        </p>
    </div>

    <script>
        function gerarPix(event) {
            event.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            
            // Validação
            if (!nome || !email) {
                alert('Preencha todos os campos!');
                return false;
            }
            
            // Mostrar loading
            btn.disabled = true;
            btn.textContent = '⏳ Gerando PIX...';
            status.className = 'loading';
            status.textContent = 'Aguarde...';
            status.style.display = 'block';
            
            // Pegar motorista da URL
            const params = new URLSearchParams(window.location.search);
            const motorista = params.get('motorista') || 'LARA';
            
            // Chamar webhook
            const webhookUrl = 'https://prazermauricio.app.n8n.cloud/webhook/Pagar';
            const url = webhookUrl + '?nome=' + encodeURIComponent(nome) + '&email=' + encodeURIComponent(email) + '&motorista=' + motorista;
            
            console.log('Chamando:', url);
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    console.log('Resposta:', data);
                    
                    if (data.sucesso && data.pixCopiaECola) {
                        // Copiar PIX
                        const pixCode = data.pixCopiaECola;
                        
                        if (navigator.clipboard) {
                            navigator.clipboard.writeText(pixCode).then(() => {
                                console.log('PIX copiado!');
                            });
                        }
                        
                        // Detectar mobile
                        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                        
                        status.className = 'success';
                        status.textContent = '✅ PIX gerado! Redirecionando...';
                        
                        // Redirecionar
                        setTimeout(() => {
                            if (isMobile) {
                                window.location.href = 'https://nubank.com.br/pagar/' + encodeURIComponent(pixCode);
                                setTimeout(() => {
                                    window.location.href = data.invoiceUrl;
                                }, 2000);
                            } else {
                                window.open(data.invoiceUrl, '_blank');
                                alert('✅ PIX copiado! Acesse a página que abriu para pagar.');
                            }
                        }, 1000);
                        
                    } else {
                        throw new Error('Resposta inválida');
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    status.className = 'error';
                    status.textContent = '❌ Erro ao gerar PIX. Tente novamente.';
                    btn.disabled = false;
                    btn.textContent = '💳 Gerar Pix Agora';
                });
            
            return false;
        }
    </script>
</body>
</html>
