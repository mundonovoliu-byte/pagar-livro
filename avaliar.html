<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliar Motorista</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #13131a;
            --border: rgba(255,255,255,0.07);
            --accent: #f5c518;
            --accent2: #ff6b35;
            --text: #f0f0f5;
            --muted: #6b6b80;
            --success: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -40%;
            left: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(245,197,24,0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,107,53,0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            max-width: 440px;
            width: 100%;
            padding: 44px 36px;
            position: relative;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(32px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245,197,24,0.1);
            border: 1px solid rgba(245,197,24,0.2);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        h1 {
            font-family: 'Sora', sans-serif;
            color: var(--text);
            font-size: 26px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 8px;
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 36px;
        }

        /* Estrelas */
        .stars-section { margin-bottom: 32px; }

        .stars-label {
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            display: block;
        }

        .stars {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .star {
            font-size: 44px;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
            filter: grayscale(1) brightness(0.4);
            user-select: none;
            line-height: 1;
        }

        .star:hover,
        .star.active {
            filter: grayscale(0) brightness(1);
            transform: scale(1.15);
        }

        .star.active {
            animation: starPop 0.2s ease;
        }

        @keyframes starPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1.15); }
        }

        .star-label {
            text-align: center;
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            min-height: 20px;
            margin-top: 12px;
            transition: opacity 0.2s;
        }

        /* Pergunta sim/não */
        .question-section { margin-bottom: 28px; }

        .question-text {
            color: var(--text);
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .yn-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .yn-btn {
            padding: 14px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            background: transparent;
            color: var(--muted);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .yn-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

        .yn-btn.selected-yes {
            border-color: var(--success);
            background: rgba(34,197,94,0.08);
            color: var(--success);
        }

        .yn-btn.selected-no {
            border-color: var(--accent2);
            background: rgba(255,107,53,0.08);
            color: var(--accent2);
        }

        /* Comentário */
        .comment-section { margin-bottom: 28px; }

        .comment-label {
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .optional-tag {
            color: var(--muted);
            font-size: 11px;
            font-weight: 400;
            background: rgba(255,255,255,0.05);
            padding: 2px 8px;
            border-radius: 100px;
        }

        textarea {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            height: 90px;
            transition: border-color 0.2s;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: rgba(245,197,24,0.3);
        }

        textarea::placeholder { color: var(--muted); }

        /* Nome */
        .name-section { margin-bottom: 32px; }

        input[type="text"] {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: rgba(245,197,24,0.3);
        }

        input[type="text"]::placeholder { color: var(--muted); }

        /* Botão */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, #e5b800 100%);
            color: #0a0a0f;
            border: none;
            padding: 17px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Sora', sans-serif;
            transition: all 0.2s ease;
            box-shadow: 0 8px 32px rgba(245,197,24,0.25);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(245,197,24,0.35);
        }

        .btn-submit:disabled {
            background: #2a2a35;
            color: var(--muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Spinner */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top: 2px solid #0a0a0f;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Sucesso */
        .success-screen {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .success-screen.active { display: block; }
        .form-area.hidden { display: none; }

        .success-icon {
            width: 80px; height: 80px;
            background: rgba(34,197,94,0.1);
            border: 2px solid rgba(34,197,94,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
            animation: successPop 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes successPop {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .success-screen h2 {
            font-family: 'Sora', sans-serif;
            color: var(--text);
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .success-screen p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Logo UbiStore -->
    <div style="margin-bottom:28px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="140" height="88">
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a1a2e"/>
            <stop offset="100%" style="stop-color:#0f0f1a"/>
          </linearGradient>
          <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#f5c518"/>
            <stop offset="100%" style="stop-color:#ff6b35"/>
          </linearGradient>
        </defs>
        <rect width="320" height="200" rx="20" fill="url(#bgGrad)"/>
        <rect x="40" y="0" width="80" height="3" rx="2" fill="url(#accentGrad)"/>
        <text x="40" y="95" font-family="'Arial Black', sans-serif" font-size="72" font-weight="900" fill="white" letter-spacing="-2">Ub</text>
        <g transform="translate(148, 58)">
          <rect x="0" y="14" width="44" height="18" rx="4" fill="url(#accentGrad)"/>
          <rect x="7" y="6" width="28" height="12" rx="4" fill="url(#accentGrad)"/>
          <rect x="9" y="8" width="10" height="8" rx="2" fill="rgba(255,255,255,0.3)"/>
          <rect x="21" y="8" width="10" height="8" rx="2" fill="rgba(255,255,255,0.3)"/>
          <circle cx="9" cy="33" r="5" fill="#0f0f1a"/>
          <circle cx="9" cy="33" r="3" fill="#555"/>
          <circle cx="35" cy="33" r="5" fill="#0f0f1a"/>
          <circle cx="35" cy="33" r="3" fill="#555"/>
          <rect x="0" y="20" width="4" height="4" rx="1" fill="#fff9c4"/>
          <rect x="40" y="20" width="4" height="4" rx="1" fill="#ff6b35" opacity="0.8"/>
        </g>
        <text x="40" y="155" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="8" fill="url(#accentGrad)">STORE</text>
        <text x="40" y="178" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.35)" letter-spacing="3">VENDA. REPASSE. AUTOMATIZE.</text>
      </svg>
    </div>

    <!-- Header -->
    <div class="top-badge">⭐ Avaliação</div>
    <h1>Como foi sua<br>experiência com <span id="motoristaName">o motorista</span>?</h1>
    <p class="subtitle">Leva menos de 30 segundos. Sua opinião ajuda muito!</p>

    <!-- Formulário -->
    <div class="form-area" id="formArea">

        <!-- Estrelas -->
        <div class="stars-section">
            <span class="stars-label">Nota geral</span>
            <div class="stars" id="starsContainer">
                <span class="star" data-value="1">⭐</span>
                <span class="star" data-value="2">⭐</span>
                <span class="star" data-value="3">⭐</span>
                <span class="star" data-value="4">⭐</span>
                <span class="star" data-value="5">⭐</span>
            </div>
            <div class="star-label" id="starLabel"></div>
        </div>

        <div class="divider"></div>

        <!-- Pergunta sim/não -->
        <div class="question-section">
            <p class="question-text">😊 O motorista te indicou o livro de forma simpática?</p>
            <div class="yn-options">
                <button class="yn-btn" id="btnSim" onclick="selectYN('sim')">👍 Sim</button>
                <button class="yn-btn" id="btnNao" onclick="selectYN('nao')">👎 Não</button>
            </div>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="enviarAvaliacao()">
            ✨ Enviar Avaliação
        </button>

    </div>

    <!-- Tela de sucesso -->
    <div class="success-screen" id="successScreen">
        <div class="success-icon">🎉</div>
        <h2>Obrigado pela avaliação!</h2>
        <p>Sua opinião é muito importante e ajuda os motoristas a melhorarem cada vez mais. 💙</p>
    </div>
</div>

<script>
    const WEBHOOK_URL = 'https://oprecodadesconfianca.app.n8n.cloud/webhook/avaliar-motorista';
    const STAR_LABELS = ['', 'Péssimo 😞', 'Ruim 😕', 'Regular 😐', 'Bom 😊', 'Excelente! 🤩'];

    let nota = 0;
    let simpatico = null;

    // Pega nome do motorista da URL
    const urlParams = new URLSearchParams(window.location.search);
    const motorista = (urlParams.get('motorista') || 'o motorista').toUpperCase();
    document.getElementById('motoristaName').textContent = motorista;

    // Estrelas
    const stars = document.querySelectorAll('.star');
    stars.forEach(star => {
        star.addEventListener('click', function() {
            nota = parseInt(this.dataset.value);
            stars.forEach((s, i) => {
                s.classList.toggle('active', i < nota);
            });
            document.getElementById('starLabel').textContent = STAR_LABELS[nota];
        });

        star.addEventListener('mouseover', function() {
            const val = parseInt(this.dataset.value);
            stars.forEach((s, i) => {
                s.style.filter = i < val ? 'grayscale(0) brightness(1)' : 'grayscale(1) brightness(0.4)';
            });
        });

        star.addEventListener('mouseout', function() {
            stars.forEach((s, i) => {
                s.style.filter = i < nota ? 'grayscale(0) brightness(1)' : 'grayscale(1) brightness(0.4)';
            });
        });
    });

    function selectYN(val) {
        simpatico = val;
        document.getElementById('btnSim').className = 'yn-btn' + (val === 'sim' ? ' selected-yes' : '');
        document.getElementById('btnNao').className = 'yn-btn' + (val === 'nao' ? ' selected-no' : '');
    }

    async function enviarAvaliacao() {
        if (nota === 0) { alert('Por favor, dê uma nota de 1 a 5 estrelas!'); return; }
        if (!simpatico) { alert('Por favor, responda se o motorista foi simpático!'); return; }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Enviando...';

        const payload = {
            motorista,
            nota,
            simpatico,
            comentario: document.getElementById('comentario').value.trim(),
            nomePassageiro: document.getElementById('nomePassageiro').value.trim() || 'Anônimo',
            data: new Date().toLocaleDateString('pt-BR')
        };

        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('formArea').classList.add('hidden');
            document.getElementById('successScreen').classList.add('active');

        } catch (error) {
            // Mesmo com erro de CORS, considera enviado
            document.getElementById('formArea').classList.add('hidden');
            document.getElementById('successScreen').classList.add('active');
        }
    }
</script>
</body>
</html>
